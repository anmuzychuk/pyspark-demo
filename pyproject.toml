[project]
name = "pyspark-demo"
version = "0.1.0"
description = "PySpark on a local machine: setup, examples and labs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas<3.0.0",
    "pyarrow>=18.0.0",
    "pyspark>=4.2.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbstripout>=0.8.1",
]

[tool.ruff]
line-length = 120
# Teaching code: print() is the output mechanism, and `functions as F` is the universal
# PySpark convention — so no T20/ANN/D, and N812 is off.
lint.extend-select = ["E", "W", "I", "N"]
lint.ignore = ["N812"]
